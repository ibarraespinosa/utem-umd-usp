# Regenera el PDF de la presentación y publica el sitio en GitHub Pages
# cada vez que se modifica la presentación en la rama main.
#
# El commit del PDF lo hace GITHUB_TOKEN, que no dispara nuevas ejecuciones,
# así que no se produce un ciclo.
name: PDF y sitio web

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "*.pdf"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: presentacion
  cancel-in-progress: false

jobs:
  build:
    name: Generar PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar Playwright y Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium

      - name: Generar PDF
        run: python tools/build_pdf.py UTEM-UMD-USP_presentacion.pdf

      - name: Guardar el PDF en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UTEM-UMD-USP_presentacion.pdf
          if git diff --cached --quiet; then
            echo "El PDF no cambió."
          else
            git commit -m "PDF actualizado automáticamente"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Preparar el sitio web
        run: |
          mkdir _site
          cp -r index.html css js assets UTEM-UMD-USP_presentacion.pdf _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
